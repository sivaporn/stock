<style>

*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,"Segoe UI",Roboto,"Noto Sans Thai",sans-serif;-webkit-text-size-adjust:100%}
#app{max-width:640px;margin:0 auto;padding:12px 12px 110px}
h1{font-size:20px;margin:4px 0 2px}h2{font-size:17px;margin:18px 0 8px}
.sub{color:var(--mute);font-size:14px}

.row{display:flex;gap:8px;align-items:center}.row.wrap{flex-wrap:wrap}.grow{flex:1;min-width:0}
button,.btn{font:inherit;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:11px 14px;min-height:46px;cursor:pointer}
button.pri{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:600}
button.big{width:100%;font-size:17px;min-height:54px}
button.ghost{background:transparent;border-color:transparent;color:var(--pri);padding:8px}
button.danger{color:var(--bad)}
button:disabled{opacity:.5}
input,select,textarea{font:inherit;font-size:16px;width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
label{display:block;font-size:14px;color:var(--mute);margin:10px 0 4px}
.pill{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:#eef1f5;color:#374151;white-space:nowrap}

.list .it{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.list .it:first-child{border-top:0}
.nm{font-size:15px;line-height:1.3;word-break:break-word}.sk{font-size:12px;color:var(--mute)}
.qty{display:flex;align-items:center;gap:4px}
.qty button{min-width:42px;min-height:42px;padding:0;font-size:20px}
.qty input{width:58px;text-align:center;padding:8px 4px}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:6px 0 4px}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));z-index:6}
.bar .in{max-width:640px;margin:0 auto;display:flex;gap:8px;align-items:center}
.scanbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#camBox{position:relative;border-radius:12px;overflow:hidden;background:#000;margin-top:8px;display:none}

#camBox .aim{position:absolute;left:8%;right:8%;top:50%;height:2px;background:#ef4444;box-shadow:0 0 8px #ef4444}
#camBox .x{position:absolute;right:8px;top:8px;background:rgba(0,0,0,.55);color:#fff;border:0;min-height:38px}
#camBox .hint{position:absolute;left:0;right:0;bottom:0;color:#fff;font-size:13px;text-align:center;padding:6px;background:linear-gradient(transparent,rgba(0,0,0,.6))}
#fb{margin-top:8px;padding:10px 12px;border-radius:10px;font-size:15px;display:none}
#fb.ok{display:block;background:var(--okbg);color:var(--ok)}#fb.warn{display:block;background:var(--warnbg);color:var(--warn)}#fb.bad{display:block;background:var(--badbg);color:var(--bad)}
.tabs{display:flex;gap:6px;margin:12px 0 4px;overflow-x:auto}
.tabs button{min-height:38px;padding:6px 12px;font-size:14px;white-space:nowrap}
.tabs button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.modal.hidden{display:none}
.sheet{background:#fff;width:100%;max-width:640px;max-height:88vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
#toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:10px;font-size:15px;z-index:30;display:none;max-width:90%}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi div{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center}
.kpi b{display:block;font-size:22px}.kpi span{font-size:12px;color:var(--mute)}

.spin{display:inline-block;width:16px;height:16px;border:2px solid #cbd5e1;border-top-color:var(--pri);border-radius:50%;animation:s 1s linear infinite;vertical-align:-3px}
@keyframes s{to{transform:rotate(360deg)}}
.chk{display:flex;gap:8px;align-items:center;padding:6px 0}.chk input{width:22px;height:22px}

<script>
/* อ่านรายการสินค้าจาก Commercial Invoice (PDF ข้อความ / Excel) — ใช้ได้ทั้งใน browser และ node */
(function (root) {
  const MONEY = /^\(?\$?\d{1,3}(,\d{3})*(\.\d{2,4})$|^\d+\.\d{2,4}$/;
  const num = s => Number(String(s).replace(/[,$()]/g, ''));
  const isSku = t => /^[A-Z0-9][A-Z0-9\-\.\/_]{3,}$/i.test(t) && /\d/.test(t) && /[A-Z]/i.test(t) && !MONEY.test(t);

  // รวม text item ของ pdf.js เป็นบรรทัด (y ใกล้กัน) แล้วเว้นวรรคตามระยะห่าง
  function linesFromItems(items) {
    const rows = [];
    items.filter(i => String(i.str).trim()).sort((a, b) => (a.page - b.page) || (b.y - a.y) || (a.x - b.x)).forEach(i => {
      let r = rows.find(r => r.page === i.page && Math.abs(r.y - i.y) <= Math.max(2, (i.h || 8) * 0.35));
      if (!r) { r = { page: i.page, y: i.y, items: [] }; rows.push(r); }
      r.items.push(i);
    });
    rows.sort((a, b) => (a.page - b.page) || (b.y - a.y));
    return rows.map(r => {
      r.items.sort((a, b) => a.x - b.x);
      let s = '', end = null;
      r.items.forEach(i => {
        const cw = i.w && i.str.length ? i.w / i.str.length : 4;
        if (end !== null) s += (i.x - end > cw * 0.6) ? '  ' : '';
        s += i.str; end = i.x + (i.w || cw * i.str.length);
      });
      return s;
    });
  }

  function parseRow(tokens) {
    let k = 0;
    if (/^\d{1,3}\.?$/.test(tokens[0]) && tokens.length > 2) k = 1;           // ลำดับที่
    let si = tokens.findIndex((t, i) => i >= k && i <= k + 1 && isSku(t));  // SKU อยู่ต้นบรรทัด
    if (si < 0 && k === 1 && /^[A-Z][A-Z0-9\-_]{4,}$/.test(tokens[1]) && !/^(SUB)?TOTALS?$|^(AMOUNT|FREIGHT|SHIPPING|DISCOUNT|INSURANCE|HANDLING|BALANCE)$/.test(tokens[1])) si = 1;   // SKU ตัวอักษรล้วน เช่น LENSCLEANER (ต้องมีเลขลำดับนำหน้า)
    if (si < 0) return null;
    const mi = [];
    tokens.forEach((t, i) => { if (i > si && MONEY.test(t)) mi.push(i); });
    return { si, mi };
  }

  function fromLines(lines) {
    const text = lines.join('\n');
    const out = { ciNo: '', poNo: '', total: null, lines: [], warnings: [] };
    const m1 = text.match(/Invoice\s*(?:No\.?|Number|#)\s*:?\s*([A-Z0-9][A-Z0-9\-\/_.]{3,})/i); if (m1) out.ciNo = m1[1];
    const m2 = text.match(/P\.?\s*O\.?\s*(?:No\.?|Number|#)?\s*:\s*([A-Z0-9][A-Z0-9\-\/_.]{2,})/i) || text.match(/\b(TPO-\d+)\b/); if (m2) out.poNo = m2[1];
    let pend = null;
    const finish = (tokens, info) => {
      const sku = tokens[info.si].toUpperCase();
      const m = info.mi;
      const unit = num(tokens[m[0]]), amount = m.length > 1 ? num(tokens[m[1]]) : NaN;
      let qtyTok = null;
      for (let i = m[0] - 1; i > info.si; i--) { const g = tokens[i].match(/(\d+)$/); if (g) { qtyTok = { i, n: Number(g[1]), glued: g[1] !== tokens[i] }; break; } }
      let qty = null, how = '';
      if (unit > 0 && amount > 0 && Math.abs(amount / unit - Math.round(amount / unit)) < 0.01) { qty = Math.round(amount / unit); how = 'amount'; }
      if (qtyTok && (!qty || (!qtyTok.glued && qtyTok.n !== qty && qty === null))) { qty = qtyTok.n; how = 'qty'; }
      if (qty === null && qtyTok) { qty = qtyTok.n; how = 'qty'; }
      const descEnd = qtyTok ? qtyTok.i : m[0];
      let desc = tokens.slice(info.si + 1, descEnd).join(' ');
      if (qtyTok && qtyTok.glued) desc += ' ' + tokens[qtyTok.i].replace(/\d+$/, '');
      out.lines.push({ sku, desc: desc.trim(), qty: qty || 0, unit: unit || null, amount: isNaN(amount) ? null : amount, check: how });
    };
    lines.forEach(line => {
      const tokens = line.trim().split(/\s+/).filter(Boolean);
      if (!tokens.length) return;
      const tq = line.match(/(?:^|\s)(\d[\d,]*)\s+TOTAL\b/i) || line.match(/TOTAL\s*(?:QTY|QUANTITY|PCS|UNITS?)\s*:?\s*(\d[\d,]*)/i);
      if (tq && out.total === null) out.total = num(tq[1]);
      if (pend) {
        pend.tokens = pend.tokens.concat(tokens);
        const info = parseRow(pend.tokens);
        if (info && info.mi.length) { finish(pend.tokens, info); pend = null; return; }
        if (++pend.n > 2) pend = null;
        return;
      }
      const info = parseRow(tokens);
      if (!info) return;
      if (info.mi.length) finish(tokens, info);
      else pend = { tokens, n: 0 };
    });
    out.lines = out.lines.filter(l => l.qty > 0);
    // รวม SKU ซ้ำ
    const by = {};
    out.lines = out.lines.filter(l => { if (by[l.sku]) { by[l.sku].qty += l.qty; return false; } by[l.sku] = l; return true; });
    const sum = out.lines.reduce((n, l) => n + l.qty, 0);
    if (out.total !== null && out.total !== sum) out.warnings.push('ยอดรวมที่อ่านได้ ' + sum + ' ชิ้น ไม่ตรงกับยอดรวมใน CI ' + out.total + ' ชิ้น');
    if (!out.lines.length) out.warnings.push('อ่านรายการสินค้าไม่ได้ — ไฟล์อาจเป็นภาพสแกน ให้ใช้ไฟล์ Excel หรือพิมพ์รายการเอง');
    return out;
  }

  // Excel/CSV: rows = array ของ array
  function fromRows(rows) {
    const out = { ciNo: '', poNo: '', total: null, lines: [], warnings: [] };
    const flat = rows.map(r => r.map(c => String(c == null ? '' : c).trim()));
    const all = flat.map(r => r.join('  ')).join('\n');
    const m1 = all.match(/Invoice\s*(?:No\.?|Number|#)\s*:?\s*([A-Z0-9][A-Z0-9\-\/_.]{3,})/i); if (m1) out.ciNo = m1[1];
    const m2 = all.match(/\b(TPO-\d+)\b/) || all.match(/P\.?O\.?\s*(?:No\.?)?\s*:\s*([A-Z0-9\-]{3,})/i); if (m2) out.poNo = m2[1];
    let h = -1, cs = -1, cq = -1, cd = -1;
    for (let i = 0; i < Math.min(flat.length, 40) && h < 0; i++) {
      const r = flat[i].map(c => c.toLowerCase());
      const q = r.findIndex(c => /^(qty|q'ty|quantity|จำนวน|pcs|units?)\b/.test(c));
      const s = r.findIndex(c => /(^item|sku|part|code|model|style|article|รหัส)/.test(c) && !/desc/.test(c));
      if (q >= 0 && s >= 0) { h = i; cq = q; cs = s; cd = r.findIndex(c => /desc|รายการ|name/.test(c)); }
    }
    if (h < 0) { out.warnings.push('หาแถวหัวตาราง (Item/SKU + Qty) ในไฟล์ Excel ไม่เจอ'); return out; }
    for (let i = h + 1; i < flat.length; i++) {
      const r = flat[i], sku = (r[cs] || '').toUpperCase(), q = num(r[cq]);
      if (!sku) { if (/total/i.test(r.join(' '))) { const t = r.map(num).filter(n => n > 0); if (t.length && out.total === null) out.total = num(r[cq]) || null; } continue; }
      if (/total/i.test(sku)) { out.total = q || null; continue; }
      if (!(q > 0)) continue;
      out.lines.push({ sku, desc: cd >= 0 ? r[cd] : '', qty: Math.round(q), unit: null, amount: null, check: 'excel' });
    }
    const sum = out.lines.reduce((n, l) => n + l.qty, 0);
    if (out.total && out.total !== sum) out.warnings.push('ยอดรวมที่อ่านได้ ' + sum + ' ชิ้น ไม่ตรงกับยอดรวมใน CI ' + out.total + ' ชิ้น');
    if (!out.lines.length) out.warnings.push('อ่านรายการสินค้าจาก Excel ไม่ได้');
    return out;
  }

  root.CIParse = { linesFromItems, fromLines, fromRows };
  if (typeof module !== 'undefined') module.exports = root.CIParse;
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>
/* ───────── พื้นฐาน ───────── */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const call = async (fn, ...a) => {
  if (window.__mock) return window.__mock[fn](...a);
  let r, txt;
  try {
    r = await fetch(API_URL, { method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: fn, args: a }) });
    txt = await r.text();
  } catch (e) { throw new Error('เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ ตรวจอินเทอร์เน็ตแล้วลองใหม่'); }
  let j;
  try { j = JSON.parse(txt); } catch (e) { throw new Error('เซิร์ฟเวอร์ตอบกลับไม่ถูกต้อง (' + r.status + ') — ตรวจว่า Deploy เวอร์ชันใหม่แล้ว และสิทธิ์เป็น "ทุกคน"'); }
  if (!j.ok) throw new Error(j.error || 'เกิดข้อผิดพลาด');
  return j.data;
};
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
const lsKeys = pre => { try { return Object.keys(localStorage).filter(k => k.indexOf(pre) === 0); } catch (e) { return []; } };
const norm = c => { c = String(c == null ? '' : c).trim().toUpperCase().replace(/\s+/g, ''); if (/^\d+$/.test(c)) c = c.replace(/^0+/, ''); return c; };
let DEVICE = LS.get('whc.device', '');
if (!DEVICE) { DEVICE = 'D' + Math.random().toString(36).slice(2, 8).toUpperCase(); LS.set('whc.device', DEVICE); }
function toast(m, ms) { const t = $('#toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(toast._t); toast._t = setTimeout(() => t.style.display = 'none', ms || 2200); }
function modal(html) { $('#mb').innerHTML = html; $('#modal').classList.remove('hidden'); }
function closeModal() { $('#modal').classList.add('hidden'); $('#mb').innerHTML = ''; }
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
function errBox(e) { return '<div class="card" style="color:var(--bad)">' + esc(e && e.message || e) + '</div>'; }
let AC;
function beep(ok) {
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain();
    o.frequency.value = ok ? 1650 : 300; g.gain.value = .12; o.connect(g); g.connect(AC.destination);
    o.start(); o.stop(AC.currentTime + (ok ? .09 : .3));
  } catch (e) {}
  try { navigator.vibrate && navigator.vibrate(ok ? 40 : [80, 60, 80]); } catch (e) {}
}
const S = { boot: null, rd: null, rid: '', zone: '', counts: {}, unk: {}, tab: 'done', q: '' };
const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

/* ───────── หน้าแรก ───────── */
async function home() {
  camStop(); S.rid = ''; S.rd = null;
  $('#app').innerHTML = '<div class="card"><span class="spin"></span> กำลังโหลด…</div>';
  try { S.boot = await call('whBoot', TOKEN); } catch (e) { $('#app').innerHTML = errBox(e); return; }
  const b = S.boot, job = b.job || {};
  const age = b.stockAt ? (Date.now() - Number(b.stockAt)) / 3600000 : 999;
  const stockTxt = b.stockAt ? new Date(Number(b.stockAt)).toLocaleString('th-TH', {dateStyle: 'medium', timeStyle: 'short'}) : 'ยังไม่เคยดึง';
  let h = `<h1>ตรวจนับคลัง</h1><div class="sub">${esc(b.staff.name)} · เทียบกับยอด${b.basis === 'physical' ? 'กายภาพ' : 'บัญชี'}ใน Zoho</div>`;
  h += `<div class="card"><div class="row"><div class="grow"><b>ยอดจาก Zoho</b><div class="sub">อัปเดต: ${esc(stockTxt)}
    ${age > 12 && b.stockAt ? ' <span class="pill warn">เกิน 12 ชม.</span>' : ''}</div></div>
    <button id="btnRef" class="pri">ดึงยอดใหม่</button></div><div id="refMsg" class="sub" style="margin-top:6px">${job.running ? esc(job.msg) : ''}</div></div>`;
  h += `<h2>รอบนับที่เปิดอยู่</h2>`;
  if (!b.open.length) h += `<div class="card sub">ยังไม่มีรอบที่เปิดอยู่</div>`;
  b.open.forEach(o => {
    h += `<div class="card" data-rid="${esc(o.id)}"><div class="row"><div class="grow"><b>${esc(o.wh)}</b>
      <div class="sub">${esc(o.id)} · ${esc(o.scope)}<br>เปิดโดย ${esc(o.openedBy)} ${esc(o.openedAt)} · ส่งแล้ว ${o.zones} โซน ${o.pieces} ชิ้น</div></div>
      <button class="pri">เปิด</button></div></div>`;
  });
  h += `<button id="btnNew" class="big" style="margin-top:6px">+ เปิดรอบนับใหม่</button>`;
  h += `<button id="btnRc" class="big" style="margin-top:8px">+ ตรวจรับสินค้าเข้า (เทียบ CI)</button>`;
  if (b.recent.length) {
    h += `<h2>รอบที่ผ่านมา</h2><div class="card list">`;
    b.recent.forEach(o => {
      h += `<div class="it"><div class="grow"><div class="nm">${esc(o.wh)}</div><div class="sk">${esc(o.id)} · ${esc(o.closedAt)}</div></div>
        ${o.status === 'ยกเลิก' ? '<span class="pill">ยกเลิก</span>' : `<span class="pill ok">ตรง ${o.match}</span> <span class="pill bad">ขาด ${o.short}</span> <span class="pill warn">เกิน ${o.over}</span>`}</div>`;
    });
    h += `</div>`;
  }
  $('#app').innerHTML = h;
  $('#btnRef').onclick = refreshZoho;
  $('#btnNew').onclick = newRound;
  $('#btnRc').onclick = receiptNew;
  document.querySelectorAll('[data-rid]').forEach(el => el.onclick = () => roundView(el.dataset.rid));
  if (job.running && Date.now() - job.beat < 10 * 60000) refreshZoho(true);
}

async function refreshZoho(resume) {
  const btn = $('#btnRef'), msg = $('#refMsg');
  if (btn) btn.disabled = true;
  try {
    let j = await call(resume === true ? 'whRefreshStep' : 'whStartRefresh', TOKEN);
    while (j && j.running) {
      if (msg) msg.innerHTML = '<span class="spin"></span> ' + esc(j.msg) + ' — เปิดหน้านี้ค้างไว้';
      j = await call('whRefreshStep', TOKEN);
    }
    toast(j && j.msg || 'เสร็จแล้ว', 3000);
    home();
  } catch (e) { if (msg) msg.innerHTML = '<span style="color:var(--bad)">' + esc(e.message) + '</span>'; if (btn) btn.disabled = false; }
}

async function readCI(file, whId) {
  $('#rMsg').innerHTML = '<span class="spin"></span> กำลังอ่านไฟล์…';
  try {
    let r;
    if (/\.pdf$/i.test(file.name) || file.type === 'application/pdf') {
      if (!window.pdfjsLib) {
        await loadLib(CDN + 'pdf.js/3.11.174/pdf.min.js');
        pdfjsLib.GlobalWorkerOptions.workerPort = new Worker(URL.createObjectURL(new Blob(["importScripts('" + CDN + "pdf.js/3.11.174/pdf.worker.min.js')"], { type: 'text/javascript' })));
      }
      const doc = await pdfjsLib.getDocument({ data: new Uint8Array(await file.arrayBuffer()), isEvalSupported: false, disableFontFace: true }).promise;
      const items = [];
      for (let p = 1; p <= doc.numPages; p++) {
        const tc = await (await doc.getPage(p)).getTextContent();
        tc.items.forEach(i => items.push({ str: i.str, x: i.transform[4], y: i.transform[5], w: i.width, h: i.height, page: p }));
      }
      r = CIParse.fromLines(CIParse.linesFromItems(items));
    } else {
      if (!window.XLSX) await loadLib(CDN + 'xlsx/0.18.5/xlsx.full.min.js');
      const wb = XLSX.read(new Uint8Array(await file.arrayBuffer()), { type: 'array' });
      wb.SheetNames.forEach(n => {
        const x = CIParse.fromRows(XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, raw: false, defval: '' }));
        if (!r || x.lines.length > r.lines.length) r = x;
      });
    }
    closeModal();
    reviewCI(r, file, whId);
  } catch (e) { $('#rMsg').innerHTML = '<div style="color:var(--bad)">อ่านไฟล์ไม่ได้: ' + esc(e.message) + '</div>'; }
}

async function matchLines(lines) {
  const todo = lines.filter(l => l.itemId === undefined);
  if (!todo.length) return;
  const m = await call('whReceiptMatch', TOKEN, todo.map(l => ({ sku: l.sku })));
  todo.forEach((l, i) => Object.assign(l, { itemId: m[i].itemId, zSku: m[i].zSku, zName: m[i].zName }));
}
function drawReview() {
  const L = RV.lines, sum = L.reduce((n, l) => n + (Number(l.qty) || 0), 0), miss = L.filter(l => !l.itemId).length;
  const t = RV.r.total;
  let h = '';
  if (t != null) h += `<div class="card" style="background:${t === sum ? 'var(--okbg)' : 'var(--warnbg)'};color:${t === sum ? 'var(--ok)' : 'var(--warn)'}">` +
    (t === sum ? `✓ รวม ${sum} ชิ้น ตรงกับยอดรวมในไฟล์ CI` : `⚠ รวม ${sum} ชิ้น แต่ยอดรวมในไฟล์ CI = ${t} ชิ้น — ตรวจรายการที่อ่านพลาด`) + '</div>';
  (RV.r.warnings || []).filter(w => t == null || !/ไม่ตรงกับยอดรวม/.test(w)).forEach(w => h += `<div class="card" style="background:var(--warnbg);color:var(--warn)">${esc(w)}</div>`);
  if (miss) h += `<div class="card sub">${miss} รายการไม่พบใน Zoho — ยังนับได้ด้วยปุ่ม + / − หรือสแกนแล้วเลือกรายการนั้น</div>`;
  $('#vSum').innerHTML = h;
  $('#vList').innerHTML = L.map((l, i) => `<div class="it"><div class="grow"><div class="nm">${esc(l.zName || l.desc || l.sku)}</div>
      <div class="sk">CI: ${esc(l.sku)} · ${l.itemId ? '<span class="pill ok">Zoho ' + esc(l.zSku) + '</span>' : '<span class="pill warn">ไม่พบใน Zoho</span>'}</div></div>
      <div class="qty"><input data-q="${i}" inputmode="numeric" value="${Number(l.qty) || 0}"><button data-x="${i}" title="ลบ">×</button></div></div>`).join('') || '<div class="sub">ยังไม่มีรายการ กด "+ เพิ่มรายการ"</div>';
  $('#vList').querySelectorAll('[data-q]').forEach(el => el.onchange = () => { RV.lines[+el.dataset.q].qty = Math.max(0, Math.round(Number(el.value) || 0)); drawReview(); });
  $('#vList').querySelectorAll('[data-x]').forEach(el => el.onclick = () => { RV.lines.splice(+el.dataset.x, 1); drawReview(); });
  $('#vTot').textContent = sum;
  $('#vCnt').textContent = '· ' + L.length + ' รายการ';
}

async function fileB64(f) {
  const u = new Uint8Array(await f.arrayBuffer()); let s = '';
  for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000));
  return btoa(s);
}

  if (RV.r.total != null && RV.r.total !== sum && !confirm('ยอดรวม ' + sum + ' ชิ้น ไม่ตรงกับยอดรวมใน CI ' + RV.r.total + ' ชิ้น\nเริ่มตรวจรับต่อหรือไม่?')) return;
  const btn = $('#vGo'); btn.disabled = true; btn.innerHTML = '<span class="spin"></span>';

      lines: L.map(l => ({ sku: l.sku, desc: l.desc || '', qty: Number(l.qty), itemId: l.itemId || null })) };
    if (RV.file && RV.file.size <= 10 * 1024 * 1024) Object.assign(ci, { fileName: RV.file.name, mime: RV.file.type || 'application/octet-stream', fileB64: await fileB64(RV.file) });

function buildIndex() {
  const d = S.rd;
  S.items = {}; d.cat.forEach(c => S.items[c[0]] = { id: c[0], sku: c[1], name: c[2], brand: c[3] });
  S.sys = {}; d.snap.forEach(s => S.sys[s[0]] = d.basis === 'physical' ? s[2] : s[1]);
  S.codes = d.codes || {};
}

function fb(kind, msg) { const el = $('#fb'); if (!el) return; el.className = kind; el.innerHTML = msg; }

function typed() {
  const v = $('#code').value.trim();
  if (!v) return;
  $('#code').value = '';
  const n = norm(v);
  if (S.codes[n] && S.codes[n].length) return handleCode(v);
  // ค้นจาก SKU/ชื่อ
  const q = v.toLowerCase();
  const hits = Object.values(S.items).filter(it => norm(it.sku) === n);
  if (hits.length === 1) return add(hits[0].id, 1, 'พิมพ์');
  const like = Object.values(S.items).filter(it => it.sku.toLowerCase().includes(q) || it.name.toLowerCase().includes(q));
  if (!like.length) { if (/^\d{6,}$/.test(n)) return handleCode(v); fb('bad', 'ไม่พบ "' + esc(v) + '"'); beep(false); return; }
  pickItem(like, 'เลือกสินค้า "' + esc(v) + '"', id => add(id, 1, 'พิมพ์'));
}

function handleCode(raw, src) {
  const n = norm(raw);
  if (!n) return;
  let ids = (S.codes[n] || []).filter(id => S.items[id]);
  if (!ids.length) {
    const bySku = Object.values(S.items).filter(it => norm(it.sku) === n);
    ids = bySku.map(it => it.id);
  }
  if (ids.length === 1) return add(ids[0], 1, src);
  if (ids.length > 1) {
    const inRound = ids.filter(id => S.sys[id] != null);
    if (inRound.length === 1) return add(inRound[0], 1, src);
    beep(true);
    return pickItem(ids.map(id => S.items[id]), 'บาร์โค้ด ' + esc(raw) + ' ตรงกับหลายรุ่น เลือกรุ่นที่ถืออยู่', id => add(id, 1, src));
  }
  unknownCode(raw);
}

function add(id, d, src) {
  const it = S.items[id];
  S.counts[id] = Math.max(0, (S.counts[id] || 0) + d);
  if (!S.counts[id]) delete S.counts[id];
  save();
  const sys = S.sys[id];
  const c = S.counts[id] || 0;
  if (d > 0) {
    beep(true);
    const scopeOut = sys == null;
    fb(scopeOut ? 'warn' : 'ok', `<b>+1</b> ${esc(it.name)}<br><span class="sk">${esc(it.sku)} · โซนนี้ ${c} ชิ้น${scopeOut ? ' · <b>' + (isRC() ? 'ไม่อยู่ใน CI' : 'ไม่มีในยอด Zoho ของคลังนี้') + '</b>' : ' · ' + (isRC() ? 'CI ' : 'Zoho ทั้งคลัง ') + sys}</span>`);
  }
  S.flash = id;
  renderList();
}

function unknownCode(raw) {
  beep(false);
  fb('bad', 'ไม่รู้จักรหัส ' + esc(raw));
  pickItem(Object.values(S.items), `ไม่รู้จักรหัส <b>${esc(raw)}</b><br><span class="sub">ค้นหารุ่นที่ถืออยู่ เลือกครั้งเดียว ระบบจำให้ทุกเครื่อง</span>`, id => {
    S.codes[norm(raw)] = [id];
    if (!/^ci:/.test(id)) call('whLearnCode', TOKEN, raw, id).catch(e => toast('จำรหัสไม่สำเร็จ: ' + e.message, 4000));
    add(id, 1, 'จับคู่');
  }, () => { const n = norm(raw); S.unk[n] = (S.unk[n] || 0) + 1; save(); fb('warn', 'นับรหัส ' + esc(raw) + ' ไว้ก่อน (ไม่รู้จัก)'); renderList(); });
}

function pickItem(list, title, onPick, onSkip) {
  const draw = q => {
    q = (q || '').toLowerCase();
    let l = list.filter(it => !q || it.sku.toLowerCase().includes(q) || it.name.toLowerCase().includes(q));

    $('#pkL').innerHTML = l.slice(0, 60).map(it => `<div class="it" data-id="${esc(it.id)}" style="cursor:pointer"><div class="grow"><div class="nm">${esc(it.name)}</div>
      <div class="sk">${esc(it.sku)} · ${esc(it.brand)}${S.sys[it.id] != null ? ' · ' + SYS() + ' ' + S.sys[it.id] : ''}</div></div><span class="pill">เลือก</span></div>`).join('')
      || '<div class="sub">ไม่พบ</div>';

  draw('');
  if ($('#pkQ')) { $('#pkQ').oninput = e => draw(e.target.value); if (!isIOS) $('#pkQ').focus(); }

  if (onSkip) $('#pkS').onclick = () => { closeModal(); onSkip(); };
}

function renderList() {
  const ids = Object.keys(S.counts), unk = Object.keys(S.unk);
  const pcs = ids.reduce((a, k) => a + S.counts[k], 0) + unk.reduce((a, k) => a + S.unk[k], 0);
  const notYet = Object.keys(S.sys).filter(id => !S.counts[id] && S.sys[id] > 0);
  $('#tot').textContent = pcs;
  $('#totItems').textContent = '· ' + (ids.length + unk.length) + ' รายการ';
  $('#tabs').innerHTML = [['done', 'นับแล้ว (' + (ids.length + unk.length) + ')'], ['todo', 'ยังไม่นับในโซนนี้ (' + notYet.length + ')']]
    .map(t => `<button data-t="${t[0]}" class="${S.tab === t[0] ? 'on' : ''}">${t[1]}</button>`).join('') +
    `<input id="lq" placeholder="กรอง" value="${esc(S.q)}" style="min-width:110px;padding:6px 10px">`;
  document.querySelectorAll('#tabs [data-t]').forEach(b => b.onclick = () => { S.tab = b.dataset.t; renderList(); });
  $('#lq').oninput = e => { S.q = e.target.value; drawRows(); };
  drawRows();
}
function drawRows() {
  const q = S.q.toLowerCase();
  const m = it => !q || it.sku.toLowerCase().includes(q) || it.name.toLowerCase().includes(q);
  let h = '';
  if (S.tab === 'done') {
    const ids = Object.keys(S.counts).filter(id => m(S.items[id]));
    if (S.flash && ids.includes(S.flash)) { ids.splice(ids.indexOf(S.flash), 1); ids.unshift(S.flash); }
    Object.keys(S.unk).forEach(c => {
      h += `<div class="it"><div class="grow"><div class="nm" style="color:var(--warn)">รหัสไม่รู้จัก ${esc(c)}</div><div class="sk"><button class="ghost" data-fix="${esc(c)}">เลือกรุ่น</button></div></div>
        <div class="qty"><button data-u="${esc(c)}" data-d="-1">−</button><input value="${S.unk[c]}" readonly><button data-u="${esc(c)}" data-d="1">+</button></div></div>`;
    });
    ids.forEach(id => h += rowHtml(id, S.counts[id]));
    if (!h) h = '<div class="sub">ยังไม่ได้นับ เริ่มสแกนได้เลย สินค้าไม่มีบาร์โค้ดเลือกจากแท็บ "ยังไม่นับในโซนนี้" หรือพิมพ์ชื่อรุ่น</div>';
  } else {
    const ids = Object.keys(S.sys).filter(id => !S.counts[id] && S.sys[id] > 0 && S.items[id] && m(S.items[id]))
      .sort((a, b) => S.items[a].sku.localeCompare(S.items[b].sku));
    ids.slice(0, 200).forEach(id => h += rowHtml(id, 0));
    if (ids.length > 200) h += `<div class="sub">แสดง 200 จาก ${ids.length} รายการ ใช้ช่องกรองเพื่อหา</div>`;
    if (!h) h = '<div class="sub">ไม่มีรายการ</div>';
  }
  $('#lst').innerHTML = h;
  $('#lst').querySelectorAll('[data-id]').forEach(b => b.onclick = () => add(b.dataset.id, Number(b.dataset.d), 'กด'));
  $('#lst').querySelectorAll('[data-u]').forEach(b => b.onclick = () => { const c = b.dataset.u; S.unk[c] = Math.max(0, (S.unk[c] || 0) + Number(b.dataset.d)); if (!S.unk[c]) delete S.unk[c]; save(); renderList(); });
  $('#lst').querySelectorAll('[data-fix]').forEach(b => b.onclick = () => {
    const c = b.dataset.fix;
    pickItem(Object.values(S.items), 'รหัส ' + esc(c) + ' คือรุ่นไหน', id => {
      S.codes[c] = [id]; if (!/^ci:/.test(id)) call('whLearnCode', TOKEN, c, id).catch(() => {});
      S.counts[id] = (S.counts[id] || 0) + S.unk[c]; delete S.unk[c]; save(); renderList();
    });
  });
  $('#lst').querySelectorAll('input[data-set]').forEach(inp => inp.onchange = () => {
    const id = inp.dataset.set, v = Math.max(0, Math.round(Number(inp.value) || 0));
    if (v) S.counts[id] = v; else delete S.counts[id];
    save(); renderList();
  });
}
function rowHtml(id, c) {
  const it = S.items[id] || { name: id, sku: '', brand: '' }, sys = S.sys[id];
  return `<div class="it"${S.flash === id ? ' style="background:var(--okbg)"' : ''}><div class="grow"><div class="nm">${esc(it.name)}</div>

    <div class="qty"><button data-id="${esc(id)}" data-d="-1">−</button><input data-set="${esc(id)}" inputmode="numeric" value="${c}"><button data-id="${esc(id)}" data-d="1">+</button></div></div>`;
}

/* ───────── กล้อง / รูป / เครื่องสแกน ───────── */
const FORMATS = ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_128', 'code_39', 'itf', 'qr_code'];
let cam = { stream: null, reader: null, timer: 0, last: '', seen: 0, on: false };
let zxP = null;
function loadZX() {
  if (window.ZXing) return Promise.resolve();
  return zxP || (zxP = new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'zxing.min.js';
    s.onload = res; s.onerror = () => { zxP = null; rej(new Error('โหลดตัวอ่านบาร์โค้ดไม่ได้ (ตรวจอินเทอร์เน็ต)')); };
    document.head.appendChild(s);
  }));
}
function zxHints() {
  const Z = window.ZXing, h = new Map();
  h.set(Z.DecodeHintType.POSSIBLE_FORMATS, [Z.BarcodeFormat.EAN_13, Z.BarcodeFormat.EAN_8, Z.BarcodeFormat.UPC_A, Z.BarcodeFormat.UPC_E,
    Z.BarcodeFormat.CODE_128, Z.BarcodeFormat.CODE_39, Z.BarcodeFormat.ITF, Z.BarcodeFormat.QR_CODE]);
  h.set(Z.DecodeHintType.TRY_HARDER, true);
  return h;
}
function zxReader() { return new window.ZXing.BrowserMultiFormatReader(zxHints(), 120); }
async function nativeFormats() {
  if (!('BarcodeDetector' in window)) return null;
  try { const f = (await BarcodeDetector.getSupportedFormats()).filter(x => FORMATS.includes(x)); return f.length ? f : null; } catch (e) { return null; }
}
function seen(code) {
  const now = Date.now();
  if (!code) { if (now - cam.seen > 700) cam.last = ''; return; }
  if (code === cam.last) { cam.seen = now; return; }
  cam.last = code; cam.seen = now;
  handleCode(code, 'กล้อง');
}
async function camStart() {
  if (cam.on) return;
  const box = $('#camBox'), v = $('#vid');
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return camFail(new Error('NotSupported'));
  box.style.display = 'block'; cam.on = true; cam.last = '';
  fb('ok', '<span class="spin"></span> กำลังเปิดกล้อง…');
  const constraints = { video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false };
  try {
    const nf = await nativeFormats();
    if (nf) {
      cam.stream = await navigator.mediaDevices.getUserMedia(constraints);
      v.srcObject = cam.stream; await v.play();
      const det = new BarcodeDetector({ formats: nf });
      const loop = async () => {
        if (!cam.on) return;
        try { const r = await det.detect(v); seen(r.length ? r[0].rawValue : null); } catch (e) {}
        cam.timer = setTimeout(loop, 130);
      };
      loop();
    } else {
      // iPhone: ส่งเฟรมจากวิดีโอให้ ZXing เอง (กันบั๊ก decodeFromConstraints ที่สร้างกรอบภาพก่อนวิดีโอพร้อม)
      await loadZX();
      const Z = window.ZXing, mfr = new Z.MultiFormatReader();
      mfr.setHints(zxHints());
      cam.stream = await navigator.mediaDevices.getUserMedia(constraints);
      v.srcObject = cam.stream; await v.play();
      const cv = document.createElement('canvas'), g = cv.getContext('2d', { willReadFrequently: true });
      const loop = () => {
        if (!cam.on) return;
        if (v.videoWidth) {
          if (cv.width !== v.videoWidth) { cv.width = v.videoWidth; cv.height = v.videoHeight; }
          g.drawImage(v, 0, 0, cv.width, cv.height);
          try {
            const r = mfr.decodeWithState(new Z.BinaryBitmap(new Z.HybridBinarizer(new Z.HTMLCanvasElementLuminanceSource(cv))));
            seen(r.getText());
          } catch (e) { seen(null); }
        }
        cam.timer = setTimeout(loop, 150);
      };
      loop();
    }
    LS.set('whc.camBlocked', false);
    fb('ok', 'กล้องพร้อม เล็งบาร์โค้ดได้เลย');
  } catch (e) { camFail(e); }
}
function camFail(e) {
  camStop();
  const n = e && (e.name || e.message) || '';
  LS.set('whc.camBlocked', true);
  fb('warn', (/NotAllowed|Permission|Security/i.test(n)
    ? 'ไม่ได้รับอนุญาตให้ใช้กล้องสดในหน้านี้'
    : /NotSupported/.test(n) ? 'เบราว์เซอร์นี้เปิดกล้องสดในหน้านี้ไม่ได้' : 'เปิดกล้องไม่ได้ (' + esc(n) + ')') +
    ' — ใช้ปุ่ม <b>ถ่ายรูปบาร์โค้ด</b> แทนได้ทุกเครื่อง');
}
function camStop() {
  cam.on = false; clearTimeout(cam.timer);
  try { cam.reader && cam.reader.reset(); } catch (e) {}
  try { cam.stream && cam.stream.getTracks().forEach(t => t.stop()); } catch (e) {}
  cam.reader = null; cam.stream = null;
  const box = $('#camBox'); if (box) box.style.display = 'none';
  const v = $('#vid'); if (v) v.srcObject = null;
}

$('#photo').addEventListener('change', async e => {
  const f = e.target.files && e.target.files[0];

    const known = codes.find(c => S.codes[norm(c)]);

  } catch (err) { fb('bad', esc(err.message)); }
});
function loadImg(src) { return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('เปิดรูปไม่ได้')); i.src = src; }); }
async function decodeImage(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await loadImg(url);
    const nf = await nativeFormats();
    if (nf) {
      try { const r = await new BarcodeDetector({ formats: nf }).detect(img); if (r.length) return [...new Set(r.map(x => x.rawValue))]; } catch (e) {}
    }
    await loadZX();
    const reader = zxReader();
    const c = document.createElement('canvas'), ctx = c.getContext('2d');
    for (const max of [1600, 1100, 2400]) {
      for (const rot of [0, 90]) {
        const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
        const w = Math.round(img.naturalWidth * s), h = Math.round(img.naturalHeight * s);
        c.width = rot ? h : w; c.height = rot ? w : h;
        ctx.save(); if (rot) { ctx.translate(h, 0); ctx.rotate(Math.PI / 2); } ctx.drawImage(img, 0, 0, w, h); ctx.restore();
        try { const r = await reader.decodeFromImageUrl(c.toDataURL('image/jpeg', .92)); if (r) return [r.getText()]; } catch (e) {}
      }
    }
    return [];
  } finally { URL.revokeObjectURL(url); }
}

// เครื่องสแกนบลูทูธ (ทำงานแบบคีย์บอร์ด) — ยิงได้เลยเมื่อไม่ได้พิมพ์อยู่ในช่องใด
let wedge = { buf: '', t: 0 };
document.addEventListener('keydown', e => {
  if (!$('#code')) return;
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
  if (!$('#modal').classList.contains('hidden')) return;
  const now = Date.now();
  if (now - wedge.t > 80) wedge.buf = '';
  wedge.t = now;
  if (e.key === 'Enter') { if (wedge.buf.length >= 4) { handleCode(wedge.buf, 'สแกนเนอร์'); } wedge.buf = ''; e.preventDefault(); return; }
  if (e.key.length === 1) wedge.buf += e.key;
});
document.addEventListener('visibilitychange', () => { if (document.hidden) camStop(); });

function start() {
  // token อยู่หลังเครื่องหมาย # (ไม่ถูกส่งไปที่ GitHub และไม่ติดไปกับลิงก์อื่น) — รองรับ ?t= / ?admin= แล้วย้ายไปไว้หลัง #
  const q = new URLSearchParams(location.search), h = new URLSearchParams(location.hash.slice(1));
  let t = h.get('t') || q.get('t') || q.get('admin') || '';
  if (t) { LS.set('whc.token', t); if (!h.get('t') || location.search) history.replaceState(null, '', location.pathname + '#t=' + encodeURIComponent(t)); }
  else t = LS.get('whc.token', '');
  TOKEN = t;
  if (!TOKEN && !window.__mock) { $('#app').innerHTML = '<div class="card">เปิดหน้านี้จาก<b>ลิงก์ส่วนตัว</b>ที่ได้รับจากผู้ดูแลระบบ</div>'; return; }
  home();
}
